name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag and the CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches __version__
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/unicom360/_version.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The CHANGELOG has a dated section for it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## [$VERSION] - YYYY-MM-DD' section" >&2
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Lint, type-check and test
        run: |
          ruff format --check
          ruff check
          mypy
          pytest

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
          listing=$( (python -m zipfile -l dist/*.whl; tar -tzf dist/*.tar.gz) )
          if echo "$listing" | grep -E 'conformance|tests/|examples/|\.github'; then
            echo "The artifacts must not ship these files." >&2
            exit 1
          fi

      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel/bin/python -c "import unicom360; print(unicom360.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/unicom360/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
